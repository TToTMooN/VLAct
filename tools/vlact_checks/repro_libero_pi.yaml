# Reproduces StarVLA/VLAct_Qwen3PI_Libero_Plus_Finetune on 8xH200.
#
# Hyperparameters mirror that release's packaged config.yaml. Notes on two
# values there that do not mean what they look like:
#
#   freeze_modules: true  -> freezes NOTHING. trainer_tools coerces any
#     non-string to "", so this is a full finetune. The paper's shallow-layer
#     protection (vision tower + LLM layers 0-17) applies to the continued
#     PRETRAINING run, not to this one.
#
#   random_init_action_model: true -> a no-op for this checkpoint. It filters
#     keys prefixed "action_model", but the released heads are named
#     pi_action_model / gr00t_action_model / oft_action_model, so it matches 0
#     of 1610 keys. The 20-D pretrain heads are dropped anyway because the load
#     is strict=False and QwenPI_v4 names its head differently; only the
#     qwen_vl_interface backbone transfers (714/714 tensors). Kept for intent.
#     See tools/vlact_checks/smoke_transfer.py.

run_id: repro_libero_pi
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: your_wandb_entity
wandb_project: starVLA_Libero
is_debug: false

framework:
  name: QwenPI_v4
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 7               # xyz + rpy + gripper, vs 20 at pretraining
    state_dim: 7
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    max_seq_len: 1024
    num_inference_timesteps: 4
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    expert_model_path: ./playground/Pretrained_models/Qwen3-0.6B
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    sequential_step_sampling: false
    CoT_prompt: 'Robot: Franka, Action: Delta EEF. FPS: 10. Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format.'
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: pyav

trainer:
  pretrained_checkpoint: ./playground/Pretrained_models/VLAct-Qwen3VL4B-Pretrained/checkpoints/steps_100000_pytorch_model.pt
  random_init_action_model: true
  reset_steps: true             # start the schedule at 0, not at pretrain step 100k
  freeze_modules: ''            # explicit: the release's `true` also froze nothing
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1.0e-04
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
