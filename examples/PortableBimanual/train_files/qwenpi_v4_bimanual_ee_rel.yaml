# Example launch (keeps GPUs 0-3 free):
# CUDA_VISIBLE_DEVICES=4,5,6,7 accelerate launch --num_processes 4 \
#   starVLA/training/train_starvla.py \
#   --config_yaml examples/PortableBimanual/train_files/qwenpi_v4_bimanual_ee_rel.yaml

run_id: qwenpi_v4_bimanual_ee_rel
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
is_debug: false

framework:
  name: QwenPI_v4
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 20
    state_dim: 31
    future_action_window_size: 23
    action_horizon: 24
    past_action_window_size: 0
    max_seq_len: 1024
    num_inference_timesteps: 4
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    expert_model_path: ./playground/Pretrained_models/Qwen3-0.6B
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /path/to/backend/generated/lerobot
    # Any unregistered name activates dataset_names; no user dataset is hardcoded.
    data_mix: backend_generated_bimanual
    dataset_names: [dataset_a, dataset_b]
    dataset_weights: [1.0, 1.0]
    robot_type: portable_bimanual_ee_rel
    bimanual_statistics_path: /path/to/vlahub/norm_stats.json
    action_mode: abs
    include_state: true
    sequential_step_sampling: false
    per_device_batch_size: 4
    load_all_data_for_training: true
    image_size: [224, 224]
    video_backend: pyav

trainer:
  # CPT backbone transfer; incompatible old action heads are skipped by strict=False.
  pretrained_checkpoint: ./playground/Pretrained_models/VLAct-Qwen3VL4B-Pretrained/checkpoints/steps_100000_pytorch_model.pt
  random_init_action_model: true
  reset_steps: true
  freeze_modules: ''
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1.0e-04
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
